AWSTemplateFormatVersion: '2010-09-09'
Description: >
  QueuePilot cost guardrail - an AWS Budget with email alerts. Deploy this FIRST, in us-east-1.
  AWS Budgets is free for the first two budgets per account. Budgets ALERT; they do not stop spending.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives budget alerts.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  MonthlyLimitUsd:
    Type: Number
    Default: 130
    MinValue: 1

Resources:
  QueuePilotBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: queuepilot-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        # Actual spend crosses $5, $20, $50 and $100 (percentages of the $130 limit).
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 3.85, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 15.4, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 38.5, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 76.9, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        # Forecast says the month will end above the full limit.
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
